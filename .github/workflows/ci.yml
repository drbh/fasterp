name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
          ~/.rustup/toolchains/*/lib/rustlib/wasm32-unknown-unknown/
        key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}-v2

    - name: Cache test data
      uses: actions/cache@v4
      with:
        path: test_data/*.fastq.gz
        key: test-data-v1-SRR5808766

    - name: Install dependencies
      run: |
        # Install OpenSSL dev for native-tls
        sudo apt-get update
        sudo apt-get install -y libssl-dev libisal-dev libdeflate-dev cmake

        # Install nucgen for test data generation
        cargo install nucgen --force
        nucgen --version

        # Ubuntu 24.04's packaged Highway is older than fastp requires.
        git init /tmp/highway-reference
        git -C /tmp/highway-reference remote add origin https://github.com/google/highway.git
        git -C /tmp/highway-reference fetch --depth 1 origin 2607d3b5b0113992fe84d3848859eae13b3b52c1
        git -C /tmp/highway-reference checkout --detach FETCH_HEAD
        cmake -S /tmp/highway-reference -B /tmp/highway-reference/build \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
          -DHWY_ENABLE_TESTS=OFF -DHWY_ENABLE_EXAMPLES=OFF
        cmake --build /tmp/highway-reference/build --parallel 2
        sudo cmake --install /tmp/highway-reference/build
        bash scripts/build_fastp_reference.sh "$RUNNER_TEMP/fastp-reference"
        echo "$RUNNER_TEMP/fastp-reference" >> "$GITHUB_PATH"

        # Install mdBook for documentation
        cargo install mdbook --force
        mdbook --version

    - name: Generate test data
      run: |
        cd test_data
        bash getdata.sh

    - name: Download real test data
      run: bash .github/scripts/download_test_data.sh test_data

    - name: Build fasterp (release)
      run: cargo build --locked --release

    - name: Run tests
      run: cargo test --locked --release
      env:
        RUST_BACKTRACE: 1

    - name: Verify fastp 1.4.0 parity at 1, 4 and 8 workers
      run: |
        cargo build --locked --release
        python3 -m unittest discover -s scripts -p 'test_*.py'
        python3 scripts/compare_fastp.py --fastp "$RUNNER_TEMP/fastp-reference/fastp" \
          --fasterp target/release/fasterp --workers 1 4 8 --workdir target/fastp-parity

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test_data/*.fq
          target/debug/deps/*.log
          target/fastp-parity/

    - name: Test WASM library on host
      run: cargo test --locked --no-default-features --features wasm --lib

    - name: Build WASM for playground
      run: |
        # Install wasm-bindgen-cli (matching version in Cargo.toml)
        cargo install wasm-bindgen-cli --version 0.2.92 --force

        # Build WASM
        RUSTFLAGS='' cargo build --locked --target wasm32-unknown-unknown --no-default-features --features wasm --lib --release

        # Generate JS bindings
        wasm-bindgen target/wasm32-unknown-unknown/release/fasterp.wasm \
          --out-dir pkg \
          --target web \
          --typescript

        # Copy to book playground
        mkdir -p book/src/playground/pkg
        cp -r pkg/* book/src/playground/pkg/

    - name: Build documentation
      run: |
        # Build mdBook
        cd book && mdbook build

        # Generate fastp report
        fastp \
          -i ../test_data/SRR5808766_1.fastq.gz \
          -I ../test_data/SRR5808766_2.fastq.gz \
          -o /tmp/fastp_out_1.fq \
          -O /tmp/fastp_out_2.fq \
          -j /tmp/fastp_report.json \
          -h book/fastp_report.html

        # Generate fasterp report
        ../target/release/fasterp \
          -i ../test_data/SRR5808766_1.fastq.gz \
          -I ../test_data/SRR5808766_2.fastq.gz \
          -o /tmp/fasterp_out_1.fq \
          -O /tmp/fasterp_out_2.fq \
          -j /tmp/fasterp_report.json \
          --html book/fasterp_report.html

    - name: Setup Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/configure-pages@v4
      with:
        enablement: true

    - name: Upload Pages artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: book/book

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
