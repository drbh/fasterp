name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    env:
      # .cargo/config.toml sets target-cpu=native for local builds. target/ is
      # cached across runners with different cpus, so build portable code here
      # (same as the release binaries, simd.rs picks avx2 at runtime)
      RUSTFLAGS: ''

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --check

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
          ~/.rustup/toolchains/*/lib/rustlib/wasm32-unknown-unknown/
        key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}-v3

    - name: Cache test data
      uses: actions/cache@v4
      with:
        path: test_data/*.fastq.gz
        key: test-data-v1-SRR5808766

    - name: Install dependencies
      run: |
        # Install OpenSSL dev for native-tls
        sudo apt-get update
        sudo apt-get install -y libssl-dev

        # Install nucgen for test data generation
        # ~/.cargo/bin is cached without cargo's install records, so only
        # install (with --force) when the cached binary is not the pinned version
        [ "$(nucgen --version 2>/dev/null)" = "nucgen 0.2.0" ] || cargo install nucgen --version 0.2.0 --locked --force
        nucgen --version

        # Install fastp for comparison (pinned, the unversioned url follows the latest release)
        wget -q https://opengene.org/fastp/fastp.1.4.0 -O fastp
        chmod +x fastp
        sudo mv fastp /usr/local/bin/
        fastp --version

        # Install mdBook for documentation
        [ "$(mdbook --version 2>/dev/null)" = "mdbook v0.5.4" ] || cargo install mdbook --version 0.5.4 --locked --force
        mdbook --version

    - name: Generate test data
      run: |
        cd test_data
        bash getdata.sh

    - name: Download real test data
      run: bash .github/scripts/download_test_data.sh test_data

    - name: Build fasterp (release)
      run: cargo build --locked --release

    - name: Run tests
      run: cargo test --locked --release
      env:
        RUST_BACKTRACE: 1

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test_data/*.fq
          target/debug/deps/*.log

    - name: Test WASM library on host
      run: cargo test --locked --no-default-features --features wasm --lib

    - name: Build WASM for playground
      run: |
        # Install wasm-bindgen-cli (matching version in Cargo.toml)
        [ "$(wasm-bindgen --version 2>/dev/null)" = "wasm-bindgen 0.2.92" ] || cargo install wasm-bindgen-cli --version 0.2.92 --force

        # Build WASM
        RUSTFLAGS='' cargo build --locked --target wasm32-unknown-unknown --no-default-features --features wasm --lib --release

        # Generate JS bindings
        wasm-bindgen target/wasm32-unknown-unknown/release/fasterp.wasm \
          --out-dir pkg \
          --target web \
          --typescript

        # Copy to book playground
        mkdir -p book/src/playground/pkg
        cp -r pkg/* book/src/playground/pkg/

    - name: Check WASM matches the native CLI
      run: |
        wasm-bindgen target/wasm32-unknown-unknown/release/fasterp.wasm --out-dir target/wasm-node --target nodejs
        mkdir -p target/wasm-parity
        gzip -dc test_data/SRR5808766_1.fastq.gz | head -n 400000 > target/wasm-parity/R1.fq || true
        gzip -dc test_data/SRR5808766_2.fastq.gz | head -n 400000 > target/wasm-parity/R2.fq || true
        node scripts/wasm_parity.js target/wasm-node target/release/fasterp target/wasm-parity/R1.fq target/wasm-parity/R2.fq

    - name: Build documentation
      run: |
        # Build mdBook
        cd book && mdbook build

        # Generate fastp report
        fastp \
          -i ../test_data/SRR5808766_1.fastq.gz \
          -I ../test_data/SRR5808766_2.fastq.gz \
          -o /tmp/fastp_out_1.fq \
          -O /tmp/fastp_out_2.fq \
          -j /tmp/fastp_report.json \
          -h book/fastp_report.html

        # Generate fasterp report
        ../target/release/fasterp \
          -i ../test_data/SRR5808766_1.fastq.gz \
          -I ../test_data/SRR5808766_2.fastq.gz \
          -o /tmp/fasterp_out_1.fq \
          -O /tmp/fasterp_out_2.fq \
          -j /tmp/fasterp_report.json \
          --html book/fasterp_report.html

    - name: Setup Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/configure-pages@v4
      with:
        enablement: true

    - name: Upload Pages artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: book/book

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
