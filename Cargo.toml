[package]
name = "fasterp"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
crossbeam-channel = "0.5"
num_cpus = "1.16"
flate2 = { version = "1.0.17", features = ["zlib-rs"], default-features = false }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
criterion = "0.5"

[profile.release]
debug = true

[[bench]]
name = "comparison"
harness = false
