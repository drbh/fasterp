[package]
name = "fasterp"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
crossbeam-channel = "0.5"
num_cpus = "1.16"
flate2 = { version = "1.0", features = ["zlib-ng"], default-features = false }
libdeflater = "1.21"
gzp = { version = "0.11", features = ["deflate_rust"], default-features = false }
zstd = { version = "0.13", optional = true }
rayon = "1.10"
once_cell = "1.20"
rustc-hash = "2.0"
memchr = "2.7"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
criterion = "0.5"
rand = "0.8"

[profile.release]
opt-level = 3              # Maximum optimization
lto = "fat"                # Full Link Time Optimization across all crates
codegen-units = 1          # Better optimization (slower compile, faster runtime)
panic = "abort"            # Smaller/faster code by not unwinding
strip = false              # Keep debug symbols for profiling (change to true for production)
overflow-checks = false    # Disable integer overflow checks for performance

